{% load static %}
<a class="card" href="{% url 'player' song.id %}">
  {% if song.cover %}
  <img class="cover" src="{% static song.cover %}" alt="Cover for {{ song.title }}">
  {% else %}
  <span class="cover" aria-hidden="true"></span>
  {% endif %}
  <span class="title">{{ song.title }}</span>
  <span class="artist">{{ song.artist }}</span>
</a>
